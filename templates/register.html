{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block auth_content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="fas fa-user-plus fa-4x text-success mb-3"></i>

                        <h2>
                            Create Account
                        </h2>

                        <p class="text-muted">
                            Register to access Hostel Management System
                        </p>

                    </div>

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    name="first_name"
                                    class="form-control"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    name="last_name"
                                    class="form-control"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100"
                        >
                            <i class="fas fa-user-check"></i>
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="mb-0">
                            Already have an account?
                            <a href="{{ url_for('auth.login') }}">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
