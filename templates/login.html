{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block auth_content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="fas fa-school fa-4x text-primary mb-3"></i>

                        <h2>
                            Hostel Management System
                        </h2>

                        <p class="text-muted">
                            Sign in to continue
                        </p>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            <i class="fas fa-sign-in-alt"></i>
                            Login
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="mb-0">
                            Don't have an account?
                            <a href="{{ url_for('auth.register') }}">
                                Register
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
